<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#25D366" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FlySend WA" />
    <meta name="description" content="Send repeated WhatsApp messages faster with templates" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>FlySend WA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // GitHub Pages fallback: convert an old path-style URL such as /FlySend/edit/3
      // into the hash route used by the static deployment.
      (function () {
        var redirect = sessionStorage.getItem("flysend-pages-redirect");
        if (redirect) {
          sessionStorage.removeItem("flysend-pages-redirect");
          window.location.hash = redirect.charAt(0) === "/" ? redirect : "/" + redirect;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function (error) {
            console.error("FlySend service worker registration failed:", error);
          });
        });
      }
    </script>
  </body>
</html>
